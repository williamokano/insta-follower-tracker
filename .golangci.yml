version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace
  settings:
    errcheck:
      # Closing a handle that was only read from cannot fail in a way the
      # caller can act on. Closers on write paths are checked explicitly.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (io.Closer).Close
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gocritic
          # Test helpers close the response body; the linter cannot see across
          # the helper boundary.
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
