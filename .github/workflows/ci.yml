name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # The pinned release must be built with a Go at least as new as the
      # language version go.mod targets, or it refuses to load the config. That
      # is why the go directive there sits at 1.26 while everything is built
      # with 1.27 -- see the comment in go.mod before raising it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The multi-arch build above proves the image compiles, not that it runs.
      # Load the native architecture into the daemon and let the container's own
      # HEALTHCHECK pass judgement: a probe that cannot reach the service leaves
      # the container "unhealthy" forever, which is invisible to a build-only
      # job and is exactly how a malformed probe URL reached users.
      - name: Load image for the runner's architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ift:ci
          build-args: VERSION=ci
          cache-from: type=gha

      - name: Container reaches a healthy state
        run: |
          set -euo pipefail
          docker run -d --name ift-ci -p 8080:8080 ift:ci

          # start-period is 5s and interval 30s, so the first verdict lands at
          # about 5s and a retry at about 35s. Two minutes covers a slow runner
          # without waiting on the full three-strikes-to-unhealthy sequence.
          for _ in $(seq 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' ift-ci)
            case "$state" in
              healthy) echo "container is healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done

          echo "container never became healthy (last state: ${state:-unknown})"
          echo "--- probe log ---"
          docker inspect --format '{{json .State.Health}}' ift-ci
          echo "--- container log ---"
          docker logs ift-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f ift-ci || true
