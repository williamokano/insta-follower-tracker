version: 2

# open-pull-requests-limit defaults to 5 per ecosystem. github-actions hit that
# exactly on the first run, and a truncated list of updates looks identical to a
# complete one, so every ecosystem is given room to report everything it finds.

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(docker)"
